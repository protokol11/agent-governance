[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "parity-meter"
version = "0.1.0"
description = "Offline replay engine that turns pi session files into parity ledger rows"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
parity-meter = "parity_meter.__main__:main"

[tool.setuptools]
packages = ["parity_meter"]
